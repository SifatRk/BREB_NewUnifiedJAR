server:
  port: 8080
  netty:
    max-initial-line-length: 8192
    max-header-size: 16384

spring:
  application:
    name: api-gateway-service
  codec:
    max-in-memory-size: 5MB

breb:
  gateway:
    cors:
      allowed-origins:
        - http://localhost:3000
        - http://103.138.26.157:8000
      allowed-origin-patterns: []
      allow-credentials: false
    logging:
      enabled: true
      log-body-max-bytes: 65536
      redacted-headers:
        - authorization
        - cookie
        - set-cookie
      redacted-fields:
        - password
        - oldPassword
        - newPassword
        - confirmPassword
        - otp
        - token
        - refreshToken
        - accessToken
        - idToken
        - secret
        - pin

# ==========================================
# BREB Microservices Configuration
